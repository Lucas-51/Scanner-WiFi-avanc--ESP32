<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SondeDB — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #eef2f7;
  --bg2:     #ffffff;
  --text:    #0f172a;
  --text2:   #475569;
  --text3:   #94a3b8;
  --line:    #e2e8f0;
  --accent:  #2563eb;
  --accent2: #06b6d4;
  --ok:      #10b981;
  --danger:  #ef4444;
}

body {
  background: var(--bg);
  font-family: 'JetBrains Mono', monospace;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  position: relative;
}

/* ══ BACKGROUND LAYERS ══════════════════════════════════════════════════════ */

/* Oscilloscope-style grid */
.bg-grid {
  position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(rgba(37,99,235,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(37,99,235,0.05) 1px, transparent 1px);
  background-size: 32px 32px;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  animation: gridDrift 40s linear infinite;
}
@keyframes gridDrift {
  0%   { background-position: 0 0; }
  100% { background-position: 32px 32px; }
}

/* Radar sweep */
.radar {
  position: fixed; z-index: 1;
  top: 50%; left: 50%;
  width: 900px; height: 900px;
  transform: translate(-50%, -50%);
  pointer-events: none;
  opacity: 0.45;
}
.radar::before {
  content: '';
  position: absolute; inset: 0;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    transparent 0deg,
    transparent 270deg,
    rgba(37,99,235,0.0) 285deg,
    rgba(37,99,235,0.18) 358deg,
    rgba(37,99,235,0.0) 360deg
  );
  animation: radarSpin 5s linear infinite;
}

/* Concentric radar rings */
.radar-rings {
  position: absolute; inset: 0;
  border-radius: 50%;
}
.radar-rings::before,
.radar-rings::after,
.radar-rings span {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  border: 1px solid rgba(37,99,235,0.10);
  border-radius: 50%;
}
.radar-rings::before { width: 220px; height: 220px; }
.radar-rings::after  { width: 460px; height: 460px; }
.radar-rings span    { width: 700px; height: 700px; display: block; }
@keyframes radarSpin { to { transform: rotate(360deg); } }

/* WiFi sonar pulse from top-right */
.sonar {
  position: fixed; z-index: 1;
  top: 8%; right: 6%;
  pointer-events: none;
}
.sonar-source {
  width: 12px; height: 12px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 16px rgba(37,99,235,0.6);
  position: relative;
}
.sonar-source::before,
.sonar-source::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  border-radius: 50%;
  border: 2px solid var(--accent);
  transform: translate(-50%, -50%);
  animation: sonarPulse 3s ease-out infinite;
  opacity: 0;
}
.sonar-source::after { animation-delay: 1.5s; }
@keyframes sonarPulse {
  0%   { width: 12px;  height: 12px;  opacity: 0.6; border-width: 2px; }
  100% { width: 280px; height: 280px; opacity: 0;   border-width: 0.5px; }
}

/* Floating data packets */
.packets {
  position: fixed; inset: 0; z-index: 1;
  pointer-events: none; overflow: hidden;
}
.packet {
  position: absolute;
  width: 4px; height: 4px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 6px rgba(37,99,235,0.5);
  opacity: 0;
  animation: packetFloat 8s linear infinite;
}
@keyframes packetFloat {
  0%   { transform: translateY(100vh) translateX(0);   opacity: 0; }
  10%  { opacity: 0.8; }
  90%  { opacity: 0.8; }
  100% { transform: translateY(-40px)  translateX(40px); opacity: 0; }
}

/* Spectrum analyzer at the bottom */
.spectrum {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 1;
  height: 140px;
  display: flex; align-items: flex-end; justify-content: center;
  gap: 4px;
  padding: 0 24px 36px;
  pointer-events: none;
  mask-image: linear-gradient(to top, black 60%, transparent);
  -webkit-mask-image: linear-gradient(to top, black 60%, transparent);
}
.spec-bar {
  flex: 1;
  max-width: 36px;
  background: linear-gradient(to top, var(--accent), var(--accent2));
  border-radius: 4px 4px 0 0;
  opacity: 0.35;
  animation: specBar 1.4s ease-in-out infinite alternate;
  transform-origin: bottom;
}
@keyframes specBar {
  0%   { height: 8%;  filter: hue-rotate(0deg); }
  100% { height: 90%; filter: hue-rotate(20deg); }
}

/* Channel labels under spectrum */
.spectrum-labels {
  position: fixed; left: 0; right: 0; bottom: 12px; z-index: 1;
  display: flex; justify-content: center; gap: 4px;
  padding: 0 24px;
  pointer-events: none;
  font-size: 9px; color: var(--text3); letter-spacing: 0.5px;
}
.spectrum-labels span {
  flex: 1; max-width: 36px; text-align: center;
}

/* ══ FORM ════════════════════════════════════════════════════════════════════ */

.wrap {
  position: relative; z-index: 10;
  width: 420px;
}

.brand { text-align: center; margin-bottom: 32px; }

.logo-row {
  display: inline-flex; align-items: center; gap: 16px;
  margin-bottom: 10px;
}

.wifi-icon {
  width: 58px; height: 46px;
  filter: drop-shadow(0 4px 10px rgba(37,99,235,0.25));
}
.wifi-icon .wave {
  fill: none; stroke: url(#wifi-grad); stroke-width: 4;
  stroke-linecap: round;
}
.wifi-icon .wifi-dot { fill: url(#wifi-grad); }

.wifi-icon .wave-3 { animation: wifiPulse 1.8s ease-in-out infinite 0s; }
.wifi-icon .wave-2 { animation: wifiPulse 1.8s ease-in-out infinite 0.25s; }
.wifi-icon .wave-1 { animation: wifiPulse 1.8s ease-in-out infinite 0.5s; }
.wifi-icon .wifi-dot { animation: wifiPulse 1.8s ease-in-out infinite 0.75s; }
@keyframes wifiPulse {
  0%, 100% { opacity: 0.25; }
  50%      { opacity: 1; }
}

.wordmark {
  font-size: 38px; font-weight: 700; color: var(--text);
  letter-spacing: -1.5px; line-height: 1;
}
.wordmark .accent {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}

.brand-sub {
  font-size: 11px; color: var(--text2); margin-top: 8px;
  letter-spacing: 0.8px;
}
.brand-sub .sep { color: var(--accent2); margin: 0 6px; }

/* Card with glass effect */
.card {
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.6);
  border-radius: 16px;
  padding: 32px 36px 26px;
  box-shadow:
    0 20px 60px rgba(15,23,42,0.10),
    0 4px 12px rgba(15,23,42,0.06),
    inset 0 1px 0 rgba(255,255,255,0.7);
  position: relative;
}

/* Status header inside card */
.card-status {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.status-live {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 10px; font-weight: 700; color: var(--ok);
  letter-spacing: 0.5px;
}
.status-live::before {
  content: '';
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 0 0 rgba(16,185,129,0.6);
  animation: liveDot 1.6s ease-out infinite;
}
@keyframes liveDot {
  0%   { box-shadow: 0 0 0 0 rgba(16,185,129,0.6); }
  100% { box-shadow: 0 0 0 8px rgba(16,185,129,0); }
}
.status-meta {
  font-size: 10px; color: var(--text3);
  font-family: 'JetBrains Mono', monospace;
}

.card-title {
  font-size: 18px; font-weight: 700; color: var(--text);
  margin-bottom: 4px;
}
.card-sub { font-size: 12px; color: var(--text2); margin-bottom: 24px; }

/* Form */
.field { margin-bottom: 18px; }
.field-label {
  display: block; font-size: 10px; font-weight: 700;
  color: var(--text2); margin-bottom: 7px;
  letter-spacing: 0.8px; text-transform: uppercase;
}
.field-wrap { position: relative; }
.field-icon {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  color: var(--text3); pointer-events: none;
  transition: color .15s;
}
.field-input {
  width: 100%; background: rgba(248,250,252,0.7);
  border: 1.5px solid var(--line);
  color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 13px;
  padding: 12px 14px 12px 40px;
  border-radius: 10px; outline: none;
  transition: all .15s;
}
.field-input:focus {
  border-color: var(--accent);
  background: white;
  box-shadow: 0 0 0 4px rgba(37,99,235,0.12);
}
.field-input:focus + .field-icon,
.field-wrap:focus-within .field-icon { color: var(--accent); }
.field-input::placeholder { color: var(--text3); }

.btn {
  width: 100%;
  background: linear-gradient(135deg, var(--accent), #1d4ed8);
  border: none; border-radius: 10px;
  color: white; font-family: 'JetBrains Mono', monospace;
  font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
  padding: 14px;
  cursor: pointer;
  transition: all .15s;
  margin-top: 8px;
  box-shadow: 0 6px 18px rgba(37,99,235,0.35);
  position: relative; overflow: hidden;
}
.btn::before {
  content: '';
  position: absolute; top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transition: left .5s;
}
.btn:hover::before { left: 100%; }
.btn:hover     { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(37,99,235,0.45); }
.btn:active    { transform: translateY(0); }
.btn:disabled  { background: #94a3b8; box-shadow: none; cursor: not-allowed; transform: none; }
.btn:disabled::before { display: none; }

.error-box {
  display: none; background: #fef2f2; border: 1px solid #fecaca;
  color: var(--danger); font-size: 11px; font-weight: 600;
  padding: 10px 14px; margin-top: 14px; border-radius: 8px; text-align: center;
}
.error-box.show { display: block; animation: shake .35s ease-in-out; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-6px); }
  40%, 80% { transform: translateX(6px); }
}

/* Footer */
.foot {
  margin-top: 22px;
  display: flex; justify-content: space-between;
  font-size: 10px; color: var(--text3);
  padding: 0 6px;
}
.foot-item { display: flex; align-items: center; gap: 5px; }
.foot-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent2);
}

/* Form entrance animation */
.wrap { animation: fadeUp .6s cubic-bezier(0.22, 1, 0.36, 1) both; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
  .wrap { width: calc(100% - 32px); }
  .card { padding: 24px 22px 20px; }
}
</style>
</head>
<body>

<!-- ══ Animated background ══ -->
<div class="bg-grid"></div>
<div class="radar"><div class="radar-rings"><span></span></div></div>
<div class="sonar"><div class="sonar-source"></div></div>
<div class="packets" id="packets"></div>
<div class="spectrum" id="spectrum"></div>
<div class="spectrum-labels" id="spectrum-labels"></div>

<!-- ══ Form ══ -->
<div class="wrap">
  <div class="brand">
    <div class="logo-row">
      <svg class="wifi-icon" viewBox="0 0 60 50" aria-hidden="true">
        <defs>
          <linearGradient id="wifi-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"  stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#06b6d4"/>
          </linearGradient>
        </defs>
        <path class="wave wave-3" d="M 4 24 Q 30 -2 56 24"/>
        <path class="wave wave-2" d="M 12 30 Q 30 12 48 30"/>
        <path class="wave wave-1" d="M 20 36 Q 30 26 40 36"/>
        <circle class="wifi-dot" cx="30" cy="42" r="3.5"/>
      </svg>
      <div class="wordmark">Sonde<span class="accent">DB</span></div>
    </div>
    <div class="brand-sub">WiFi Monitor<span class="sep">·</span>BTS CIEL<span class="sep">·</span>Orange</div>
  </div>

  <div class="card">
    <div class="card-status">
      <span class="status-live">Système opérationnel</span>
      <span class="status-meta" id="status-meta">2.4 GHz · 13 canaux</span>
    </div>

    <div class="card-title">Connexion</div>
    <div class="card-sub">Accès sécurisé au dashboard ESP32</div>

    <form id="login-form" onsubmit="doLogin(event)">
      <div class="field">
        <label class="field-label" for="username">Identifiant</label>
        <div class="field-wrap">
          <input class="field-input" type="text" id="username" name="username"
                 placeholder="admin" autocomplete="username" required>
          <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
      </div>
      <div class="field">
        <label class="field-label" for="password">Mot de passe</label>
        <div class="field-wrap">
          <input class="field-input" type="password" id="password" name="password"
                 placeholder="••••••••" autocomplete="current-password" required>
          <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
      </div>
      <button class="btn" type="submit" id="btn-login">Se connecter</button>
      <div class="error-box" id="error-box">Identifiant ou mot de passe incorrect</div>
    </form>
  </div>

  <div class="foot">
    <div class="foot-item"><div class="foot-dot"></div> ESP32-WROOM-32 · Analyse RF</div>
    <div class="foot-item" id="login-time">—</div>
  </div>
</div>

<script>
// ══ Spectrum analyzer bars (13 WiFi channels) ══
const spec = document.getElementById('spectrum');
const specLbl = document.getElementById('spectrum-labels');
for (let i = 1; i <= 13; i++) {
  const bar = document.createElement('div');
  bar.className = 'spec-bar';
  // Random animation duration and delay for organic feel
  bar.style.animationDuration = (0.9 + Math.random() * 1.2).toFixed(2) + 's';
  bar.style.animationDelay    = (Math.random() * -1.5).toFixed(2) + 's';
  spec.appendChild(bar);
  const lbl = document.createElement('span');
  lbl.textContent = 'CH' + i;
  specLbl.appendChild(lbl);
}

// ══ Floating data packets ══
const packets = document.getElementById('packets');
for (let i = 0; i < 18; i++) {
  const p = document.createElement('div');
  p.className = 'packet';
  p.style.left = Math.random() * 100 + '%';
  p.style.animationDelay = (Math.random() * -8).toFixed(2) + 's';
  p.style.animationDuration = (6 + Math.random() * 5).toFixed(2) + 's';
  packets.appendChild(p);
}

// ══ Clock ══
setInterval(() => {
  document.getElementById('login-time').textContent =
    new Date().toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}, 1000);

// ══ Login ══
async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-login');
  const err = document.getElementById('error-box');
  btn.disabled = true;
  btn.textContent = 'Connexion…';
  err.classList.remove('show');

  const body = new URLSearchParams({
    username: document.getElementById('username').value.trim(),
    password: document.getElementById('password').value,
  });

  try {
    const res = await fetch('/api/login', { method: 'POST', body, credentials: 'same-origin' });
    const data = await res.json();
    if (res.ok && data.status === 'ok') {
      window.location.href = '/';
    } else {
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Se connecter';
    }
  } catch {
    err.textContent = 'Erreur réseau — serveur inaccessible';
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Se connecter';
  }
}
</script>
</body>
</html>
